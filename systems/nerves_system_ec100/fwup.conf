# Nerves firmware layout for IOTRouter EC100 / RK3506J
#
# 512-byte block layout:
#   0 .. 16 MiB        GPT/bootloader/reserved area (not touched by normal upgrades)
#   12 MiB             U-Boot environment A (128 KiB)
#   12.125 MiB         U-Boot environment B (128 KiB)
#   16 .. 48 MiB       raw FIT A
#   48 .. 80 MiB       raw FIT B
#   80 .. 336 MiB      p1 RootFS A (SquashFS)
#   336 .. 592 MiB     p2 RootFS B (SquashFS)
#   592 MiB .. GPT     p3 persistent application data (ext4, grow)
#   final 33 sectors  backup GPT
#
# Rockchip BootROM/DDR loader/U-Boot are intentionally outside the normal Nerves
# upgrade transaction. See bootstrap/README.md.

require-fwup-version="1.10.0"

define(NERVES_FW_PRODUCT, "EC100 Nerves")
define(NERVES_FW_DESCRIPTION, "Minimal Nerves system for IOTRouter EC100 / RK3506J")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "ec100")
define(NERVES_FW_ARCHITECTURE, "arm")
define(NERVES_FW_AUTHOR, "")

define(NERVES_FW_DEVPATH, "/dev/rootdisk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/rootdisk0p3")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "ext4")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")

define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Raw redundant U-Boot environment in the reserved boot area.
define(UBOOT_ENV_OFFSET, 24576)          # 12 MiB
define(UBOOT_ENV_COUNT, 256)             # 128 KiB
define(UBOOT_ENV_REDUND_OFFSET, 24832)   # 12 MiB + 128 KiB

# Raw FIT A/B slots, 32 MiB each.
define(FIT_A_OFFSET, 32768)              # 16 MiB
define(FIT_COUNT, 65536)                 # 32 MiB
define(FIT_B_OFFSET, 98304)              # 48 MiB

# RootFS A/B, 256 MiB each.
define(ROOTFS_A_PART_OFFSET, 163840)     # 80 MiB
define(ROOTFS_A_PART_COUNT, 524288)      # 256 MiB
define(ROOTFS_B_PART_OFFSET, 688128)     # 336 MiB
define(ROOTFS_B_PART_COUNT, 524288)      # 256 MiB

# Persistent data starts at 592 MiB and expands up to the backup GPT.
define(APP_PART_OFFSET, 1212416)
define(APP_PART_COUNT, 1048576)

meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

file-resource ec100.itb {
    host-path = "${NERVES_SYSTEM}/images/ec100.itb"
    assert-size-lte = ${FIT_COUNT}
}

file-resource rootfs.img {
    host-path = ${ROOTFS}
    assert-size-lte = ${ROOTFS_A_PART_COUNT}
}

gpt gpt {
    guid = "ec100000-0000-4000-8000-000000000000"
    partition 0 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = "0fc63daf-8483-4772-8e79-3d69d8477de4"
        guid = "ec100000-0000-4000-8000-000000000001"
        name = "rootfs-a"
    }
    partition 1 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = "0fc63daf-8483-4772-8e79-3d69d8477de4"
        guid = "ec100000-0000-4000-8000-000000000002"
        name = "rootfs-b"
    }
    partition 2 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = "0fc63daf-8483-4772-8e79-3d69d8477de4"
        guid = "ec100000-0000-4000-8000-000000000003"
        name = "data"
        expand = true
    }
}

uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
    block-offset-redund = ${UBOOT_ENV_REDUND_OFFSET}
}

# Initialize the Nerves-managed region on media that already has the EC100
# bootloader installed. Slot A is the initial active/validated slot.
task complete {
    require-unmounted-destination = true

    on-init {
        gpt_write(gpt)
        raw_memset(${UBOOT_ENV_OFFSET}, ${UBOOT_ENV_COUNT}, 0xff)
        raw_memset(${UBOOT_ENV_REDUND_OFFSET}, ${UBOOT_ENV_COUNT}, 0xff)

        uboot_clearenv(uboot-env)
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "upgrade_available", "0")
        uboot_setenv(uboot-env, "bootcount", "0")
        uboot_setenv(uboot-env, "bootlimit", "3")

        # Persist the A/B boot policy as well as Nerves metadata. Once a valid
        # environment exists, U-Boot no longer falls back to its compiled-in
        # default environment, so these variables must live here.
        uboot_setenv(uboot-env, "fit_a_sector", "0x8000")
        uboot_setenv(uboot-env, "fit_b_sector", "0x18000")
        uboot_setenv(uboot-env, "fit_blocks", "0x10000")
        uboot_setenv(uboot-env, "kernel_addr_r", "0x08000000")
        # Use U-Boot's $name syntax: fwup expands ${name} again when applying
        # the archive, even if escaped during archive creation.
        uboot_setenv(uboot-env, "boot_a", "setenv rootpart 1; setenv fit_sector $fit_a_sector; run boot_slot")
        uboot_setenv(uboot-env, "boot_b", "setenv rootpart 2; setenv fit_sector $fit_b_sector; run boot_slot")
        uboot_setenv(uboot-env, "boot_slot", "if mmc dev 0 && mmc read $kernel_addr_r $fit_sector $fit_blocks; then setenv bootargs earlycon=uart8250,mmio32,0xff0a0000 console=ttyS0,115200 root=/dev/mmcblk0p$rootpart rootwait ro; bootm $kernel_addr_r#conf - $kernel_addr_r#conf; else echo Nerves FIT read failed; fi")
        uboot_setenv(uboot-env, "rollback", "if test \"$upgrade_available\" = \"1\"; then if test $bootcount -gt $bootlimit; then if test \"$nerves_fw_active\" = \"a\"; then setenv nerves_fw_active b; else setenv nerves_fw_active a; fi; setenv upgrade_available 0; setenv bootcount 0; saveenv; fi; fi")
        uboot_setenv(uboot-env, "bootcmd", "run rollback; if test \"$nerves_fw_active\" = \"b\"; then run boot_b; else run boot_a; fi")

        uboot_setenv(uboot-env, "altbootcmd", "run bootcmd")
        uboot_setenv(uboot-env, "nerves_fw_devpath", ${NERVES_FW_DEVPATH})

        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }

    on-resource ec100.itb { raw_write(${FIT_A_OFFSET}) }
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }

    on-finish {
        raw_memset(${FIT_B_OFFSET}, 256, 0xff)
        raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}

task upgrade.a {
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    require-uboot-variable(uboot-env, "upgrade_available", "0")
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading EC100 slot A")
        uboot_unsetenv(uboot-env, "a.nerves_fw_version")
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "a.nerves_fw_uuid")
        trim(${FIT_A_OFFSET}, ${FIT_COUNT})
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
    }

    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_B_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_B_PART_COUNT}
        raw_write(${ROOTFS_A_PART_OFFSET})
    }
    on-resource ec100.itb {
        delta-source-raw-offset=${FIT_B_OFFSET}
        delta-source-raw-count=${FIT_COUNT}
        raw_write(${FIT_A_OFFSET})
    }

    on-finish {
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "upgrade_available", "1")
        uboot_setenv(uboot-env, "bootcount", "0")
    }
}

task upgrade.b {
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-uboot-variable(uboot-env, "upgrade_available", "0")
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading EC100 slot B")
        uboot_unsetenv(uboot-env, "b.nerves_fw_version")
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "b.nerves_fw_uuid")
        trim(${FIT_B_OFFSET}, ${FIT_COUNT})
        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
    }

    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_A_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_A_PART_COUNT}
        raw_write(${ROOTFS_B_PART_OFFSET})
    }
    on-resource ec100.itb {
        delta-source-raw-offset=${FIT_A_OFFSET}
        delta-source-raw-count=${FIT_COUNT}
        raw_write(${FIT_B_OFFSET})
    }

    on-finish {
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "b.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "b.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "b.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "b.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "b.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "b.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "b.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "b.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "b.nerves_fw_uuid", "\${FWUP_META_UUID}")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        uboot_setenv(uboot-env, "upgrade_available", "1")
        uboot_setenv(uboot-env, "bootcount", "0")
    }
}

task upgrade.unvalidated {
    require-uboot-variable(uboot-env, "upgrade_available", "1")
    on-init { error("Validate the running EC100 firmware before upgrading again") }
}

task upgrade.wrongplatform {
    on-init { error("Wrong target: expected ec100/arm") }
}
