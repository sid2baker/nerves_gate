# Firmware boot script
#
# This script expects the following Grub2 modules to be compiled
# into the grub binary (grub.img):
#
# boot linux squash4 ext2 fat part_msdos normal biosdisk loadenv echo true test
#
# `boot` selects slot A (0) or B (1). A newly installed environment has
# validated=0 and booted_once=0. GRUB records the one permitted trial before
# loading its kernel. Any later reboot while it is still unvalidated selects
# the opposite, previously validated slot.

load_env

if [ "$validated" != "1" ]; then
    if [ "$booted_once" = "1" ]; then
        echo "Trial firmware was not validated; reverting to the previous slot..."

        if [ "$boot" = "1" ]; then
            set boot=0
        else
            set boot=1
        fi

        set validated=1
        set booted_once=1
        save_env boot validated booted_once
    else
        echo "Booting unvalidated firmware once..."
        set booted_once=1
        save_env booted_once
    fi
fi

if [ "$boot" = "1" ]; then
    echo "Booting partition B..."
    linux (hd0,msdos3)/boot/bzImage root=PARTUUID=04030201-03 rootwait panic=10 console=tty1 console=ttyS0
else
    echo "Booting partition A..."
    linux (hd0,msdos2)/boot/bzImage root=PARTUUID=04030201-02 rootwait panic=10 console=tty1 console=ttyS0
fi

boot
