# Loaded by nerves_runtime before the NervesGate application starts.

# Allow all user groups to send a ping (Nerves system default).
net.ipv4.ping_group_range = 0 2147483647

# NervesGate is a gateway, so forwarding is platform policy rather than
# Tailscale process state.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
