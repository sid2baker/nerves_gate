name: Package release

on:
  push:
    tags: ['sdk/v*', 'firmware/v*', 'sim/v*', 'new/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing namespaced package tag (for an unpublished release)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'sid2baker/nerves_gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Configure required reviewers and HEX_API_KEY on this environment.
    environment: hex-release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      MIX_TARGET: host
      NERVES_GATE_LOCAL_DEPS: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: Set release paths
        run: |
          echo "NOTES_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RUNNER_TEMP/package-release" >> "$GITHUB_ENV"
      - name: Validate version and canonical changelog
        id: package
        run: mise exec -- elixir .github/scripts/package_release.exs prepare "$RELEASE_TAG"
      - name: Require a tagged commit from main
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - name: Install Mix tooling outside the project
        run: |
          # shellcheck disable=SC2016
          mise exec -- sh -eu -c '
            cd "$RUNNER_TEMP"
            mix local.hex --force --if-missing
            mix local.rebar --force --if-missing
            mix archive.install hex nerves_bootstrap "~> 1.17" --force
          '
      - name: Reject unsupported package dependencies
        run: mise exec -- elixir .github/scripts/package_release.exs dependencies "$RELEASE_TAG"
      - name: Require unpublished outputs and available consumer dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- elixir .github/scripts/package_release.exs unpublished "$RELEASE_TAG"
      - name: Install native host build prerequisites
        if: steps.package.outputs.project == 'firmware' || steps.package.outputs.project == 'sim'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libmnl-dev libnl-genl-3-dev
      - name: Build and inspect Hex payload before publication
        working-directory: ${{ steps.package.outputs.project }}
        run: |
          mkdir -p "$RELEASE_DIR"
          mise exec -- mix hex.build --output "$RELEASE_DIR/package.tar"
          mise exec -- mix hex.build --unpack --output "$RELEASE_DIR/source"
          cp mix.lock "$RELEASE_DIR/source/mix.lock"
      - name: Package unit tests (no devices)
        if: steps.package.outputs.project != 'firmware'
        working-directory: ${{ steps.package.outputs.project }}
        env:
          MIX_ENV: test
        run: |
          mise exec -- mix deps.get --check-locked
          mise exec -- mix ci
      - name: Compile and generate docs from the unpacked package
        env:
          MIX_ENV: docs
        run: |
          # shellcheck disable=SC2016
          mise exec -- sh -eu -c '
            cd "$RELEASE_DIR/source"
            mix deps.get --check-locked
            mix compile --warnings-as-errors
            mix docs --warnings-as-errors
          '
      - name: Build the app-development QEMU firmware image (no device startup)
        if: steps.package.outputs.project == 'firmware'
        working-directory: firmware
        env:
          MIX_TARGET: x86_64
          MIX_ENV: dev
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.17.1 --repo fwup-home/fwup --pattern fwup_1.17.1_amd64.deb --dir "$RUNNER_TEMP"
          printf '%s  %s\n' b73ca78effe61e4c8cedcff567ca137b6bdaa1772b84f9e4d88913f192c09bf2 "$RUNNER_TEMP/fwup_1.17.1_amd64.deb" | sha256sum --check
          sudo apt-get install --yes "$RUNNER_TEMP/fwup_1.17.1_amd64.deb" squashfs-tools
          mise exec -- mix deps.get --check-locked
          mise exec -- mix tailscaled.install
          mise exec -- mix firmware --overwrite
          cp _build/x86_64_dev/nerves/images/nerves_gate.fw "$RELEASE_DIR/nerves_gate-x86_64-$PACKAGE_VERSION.fw"
      - name: Build and install generator archive outside the checkout
        if: steps.package.outputs.project == 'new'
        env:
          MIX_ENV: prod
          PACKAGE_APP: ${{ steps.package.outputs.app }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          # shellcheck disable=SC2016
          mise exec -- sh -eu -c '
            cd "$RELEASE_DIR/source"
            mix deps.get --check-locked
            mix archive.build --output "$RELEASE_DIR/$PACKAGE_APP-$PACKAGE_VERSION.ez"
          '
          mise exec -- elixir .github/scripts/archive_smoke.exs "$RELEASE_DIR/$PACKAGE_APP-$PACKAGE_VERSION.ez"
      - name: Retain preflight payloads
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ steps.package.outputs.app }}-${{ steps.package.outputs.version }}
          path: |
            ${{ runner.temp }}/package-release/package.tar
            ${{ runner.temp }}/package-release/*.ez
            ${{ runner.temp }}/package-release/*.fw
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 14
      # Only this step receives registry credentials. No --replace or --clobber.
      - name: Publish Hex package and HexDocs
        env:
          MIX_ENV: docs
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          test -n "$HEX_API_KEY"
          # shellcheck disable=SC2016
          mise exec -- sh -eu -c '
            cd "$RELEASE_DIR/source"
            mix hex.publish --yes
          '
      - name: Publish canonical GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
        run: |
          options=(--verify-tag --latest=false --title "$RELEASE_TAG" --notes-file "$NOTES_FILE")
          if [ "$PRERELEASE" = true ]; then options+=(--prerelease); fi
          assets=()
          shopt -s nullglob
          assets=("$RELEASE_DIR/"*.ez "$RELEASE_DIR/"*.fw)
          gh release create "$RELEASE_TAG" "${assets[@]}" "${options[@]}"
      - name: Verify public registry, documentation and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- elixir .github/scripts/package_release.exs verify "$RELEASE_TAG"
