name: System artifact

# Trusted main-branch sources only. System releases calls this on source changes;
# manual dispatch can resume an interrupted release. Never overwrite a tag/asset.
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: choice
        options: [ec100, x86_64]

permissions:
  contents: read

concurrency:
  group: system-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sid2baker/nerves_gate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    defaults:
      run:
        working-directory: firmware
    env:
      MIX_TARGET: ${{ inputs.target }}
      MIX_ENV: dev
      NERVES_GATE_LOCAL_DEPS: '1'
      NERVES_CONTAINER_TOOL: docker
      GH_TOKEN: ${{ github.token }}
      # Cache paths must stay stable across runs; only extracted artifacts and
      # the verification download are isolated per attempt.
      NERVES_DL_DIR: ${{ github.workspace }}/_build/system-downloads/${{ inputs.target }}
      NERVES_ARTIFACTS_DIR: ${{ github.workspace }}/_build/system-release-${{ github.run_id }}-${{ inputs.target }}-${{ github.run_attempt }}/artifacts
      NERVES_SYSTEM: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select system
        run: |
          case "$MIX_TARGET" in
            ec100) echo 'SYSTEM_APP=nerves_system_ec100' >> "$GITHUB_ENV" ;;
            x86_64) echo 'SYSTEM_APP=nerves_system_ec100_qemu' >> "$GITHUB_ENV" ;;
            *) echo 'Unsupported system target' >&2; exit 1 ;;
          esac
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/host-tools
        with:
          firmware: 'true'
      - name: Check system build engine
        run: docker info
      - name: Fetch locked dependencies (no firmware or device startup)
        run: mise exec -- mix deps.get --check-locked
      - name: Check version, inputs and existing release
        id: release
        run: mise exec -- elixir -r ../lib/mix/tasks/nerves.artifact.release.ex -S mix nerves.artifact.release check
      - name: Restore system source downloads
        if: steps.release.outputs.publish == 'true'
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NERVES_DL_DIR }}
          key: system-downloads-${{ inputs.target }}-v2-${{ hashFiles(format('systems/{0}/**', env.SYSTEM_APP), 'firmware/mix.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            system-downloads-${{ inputs.target }}-v2-${{ hashFiles(format('systems/{0}/**', env.SYSTEM_APP), 'firmware/mix.lock') }}-
            system-downloads-${{ inputs.target }}-v2-
      - name: Fetch Buildroot sources before compilation
        if: steps.release.outputs.publish == 'true'
        run: mise exec -- elixir -r ../lib/mix/tasks/nerves.artifact.release.ex -S mix nerves.artifact.release source
      - name: Build system artifact
        if: steps.release.outputs.publish == 'true'
        # Nerves 2's container runner requests a TTY, including noninteractive builds.
        run: script -q -e -c "mise exec -- mix nerves.artifact.build $SYSTEM_APP" /dev/null < /dev/null
      - name: Collect Buildroot legal info, source archive and checksums
        if: steps.release.outputs.publish == 'true' && inputs.target == 'ec100'
        run: mise exec -- elixir -r ../lib/mix/tasks/nerves.artifact.release.ex -S mix nerves.artifact.release collect
      - name: Save system source downloads, including after failure
        if: ${{ !cancelled() && steps.release.outputs.publish == 'true' && steps.downloads.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.NERVES_DL_DIR }}
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Publish immutable system release
        if: steps.release.outputs.publish == 'true'
        run: mise exec -- elixir -r ../lib/mix/tasks/nerves.artifact.release.ex -S mix nerves.artifact.release publish
      - name: Verify download without the build cache
        run: mise exec -- mix nerves.artifact.get
        env:
          NERVES_DL_DIR: ${{ runner.temp }}/system-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}/verify-downloads
          NERVES_ARTIFACTS_DIR: ${{ runner.temp }}/system-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}/verify-artifacts
