name: EC100 QEMU system

# Only trusted main-branch code may publish. Never use pull_request_target
# or run fork code here with release credentials.
# Simulator CI calls this only for system-directory changes on main, and waits
# for publication before downloading the system. Manual dispatch permits retries.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ec100-qemu-system-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sid2baker/nerves_gate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MIX_TARGET: x86_64
      MIX_ENV: dev
      GH_TOKEN: ${{ github.token }}
      NERVES_DL_DIR: ${{ github.workspace }}/_build/system-release-${{ github.run_id }}-${{ github.run_attempt }}/downloads
      NERVES_ARTIFACTS_DIR: ${{ github.workspace }}/_build/system-release-${{ github.run_id }}-${{ github.run_attempt }}/artifacts
      NERVES_SYSTEM: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Install Nerves host tools
        run: |
          gh release download v1.17.1 --repo fwup-home/fwup --pattern fwup_1.17.1_amd64.deb --dir "$RUNNER_TEMP"
          printf '%s  %s\n' b73ca78effe61e4c8cedcff567ca137b6bdaa1772b84f9e4d88913f192c09bf2 "$RUNNER_TEMP/fwup_1.17.1_amd64.deb" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes "$RUNNER_TEMP/fwup_1.17.1_amd64.deb" squashfs-tools
          docker info
      - name: Install Mix tooling outside the project
        # Resolve mise.toml first, then leave the project until Hex is available.
        run: |
          # Expand RUNNER_TEMP in the child shell, after mise resolves this project.
          # shellcheck disable=SC2016
          mise exec -- sh -eu -c '
            cd "$RUNNER_TEMP"
            mix local.hex --force --if-missing
            mix local.rebar --force --if-missing
            mix archive.install hex nerves_bootstrap "~> 1.17" --force
          '
      - name: Fetch locked dependencies (no firmware or QEMU startup)
        run: mise exec -- mix deps.get --check-locked
      - name: Check version, inputs and existing release
        id: release
        run: mise exec -- elixir -r dev/artifact_release.ex -S mix nerves.artifact.release check
      - name: Cache system source downloads
        if: steps.release.outputs.publish == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.NERVES_DL_DIR }}
          key: ec100-qemu-downloads-v1-${{ hashFiles('systems/nerves_system_ec100_qemu/**', 'mix.lock') }}
          restore-keys: ec100-qemu-downloads-v1-
      - name: Build the system artifact
        if: steps.release.outputs.publish == 'true'
        run: mise exec -- mix nerves.artifact.build nerves_system_ec100_qemu
      - name: Publish the immutable system release
        if: steps.release.outputs.publish == 'true'
        run: mise exec -- elixir -r dev/artifact_release.ex -S mix nerves.artifact.release publish
      - name: Verify downloads without the build cache
        run: mise exec -- mix nerves.artifact.get
        env:
          NERVES_DL_DIR: ${{ runner.temp }}/ec100-qemu-${{ github.run_id }}-${{ github.run_attempt }}/verify-downloads
          NERVES_ARTIFACTS_DIR: ${{ runner.temp }}/ec100-qemu-${{ github.run_id }}-${{ github.run_attempt }}/verify-artifacts
