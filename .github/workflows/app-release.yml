name: App release

on:
  push:
    tags: ['apps/*/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing apps/APP/vX.Y.Z tag for an unpublished first-party app
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: app-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'sid2baker/nerves_gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: app-release
    permissions:
      contents: write
      actions: read
    env:
      MIX_TARGET: host
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/host-tools
      - name: Require a tagged commit from main
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          echo "APP_RELEASE_DIR=$RUNNER_TEMP/app-release" >> "$GITHUB_ENV"
      - name: Fetch locked host dependencies
        run: mise exec -- mix deps.get --check-locked
      - name: Validate canonical app metadata and exact-commit CI/QEMU qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise exec -- mix app.release plan "$RELEASE_TAG"
          mise exec -- mix app.release integration "$RELEASE_TAG"
          mise exec -- mix app.release unpublished "$RELEASE_TAG"
      - name: Test the first-party application without starting a bench
        run: mise exec -- mix app.test apps/tailnet_subrouter
      - name: Reject known vulnerable app dependencies before publication
        working-directory: apps/tailnet_subrouter
        env:
          MIX_ENV: prod
        run: |
          mise exec -- mix deps.get --check-locked
          mise exec -- mix hex.audit
      - name: Prepare verified archive, manifest and canonical notes from clean source
        id: prepare
        run: mise exec -- mix app.release prepare "$RELEASE_TAG" --output "$APP_RELEASE_DIR"
      - name: Publish immutable assets once
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.prepare.outputs.prerelease }}
        run: |
          args=()
          if test "$PRERELEASE" = true; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$APP_RELEASE_DIR"/*.ez "$APP_RELEASE_DIR"/*.json --verify-tag --latest=false --title "$RELEASE_TAG" --notes-file "$APP_RELEASE_DIR/release-notes.md" "${args[@]}"
      - name: Verify public notes and exact asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- mix app.release verify "$RELEASE_TAG" --output "$APP_RELEASE_DIR"
