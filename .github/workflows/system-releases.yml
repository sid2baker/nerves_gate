name: System releases

# Only the owned QEMU system is released from this repository.
on:
  push:
    branches: [main]
    paths:
      - 'systems/nerves_system_ec100_qemu/**'

permissions:
  contents: write

jobs:
  system:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64]
    uses: ./.github/workflows/system-artifact.yml
    with:
      target: ${{ matrix.target }}
