name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/host-tools
      - name: Cache host dependencies, builds and PLTs
        uses: actions/cache@v6
        with:
          path: |
            sdk/deps
            sdk/_build/test
            sim/deps
            sim/_build/test
            new/deps
            new/_build/test
            firmware/deps
            firmware/_build/test
            tools/_build/test
          key: host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', '*/mix.lock', '*/mix.exs') }}-${{ github.sha }}
          restore-keys: |
            host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', '*/mix.lock', '*/mix.exs') }}-
      - name: Fetch locked host dependencies
        run: mise exec -- mix deps.get --check-locked
      - name: Quality gates and unit tests (no devices)
        run: mise exec -- mix ci

  firmware-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIX_TARGET: x86_64
      NERVES_GATE_LOCAL_DEPS: '1'
      NERVES_SYSTEM: ''
      NERVES_DL_DIR: ${{ github.workspace }}/_build/nerves-downloads
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/host-tools
        with:
          firmware: 'true'
      - name: Cache verified firmware downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.NERVES_DL_DIR }}
            firmware/_build/setup
          key: firmware-downloads-${{ runner.os }}-${{ hashFiles('firmware/mix.lock', 'mise.toml', 'systems/nerves_system_ec100_qemu/**', 'firmware/scripts/tailscaled.ex') }}
      - name: Build target firmware (never boot a device)
        working-directory: firmware
        run: |
          mise exec -- mix deps.get --check-locked
          mise exec -- mix tailscaled.install
          mise exec -- mix nerves.artifact.get
          mise exec -- mix firmware --overwrite

  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/host-tools
        with:
          qemu: 'true'
      - name: Prepare host dependencies
        run: mise exec -- mix deps.get --check-locked
      - name: Generate a workspace against this checkout
        working-directory: new
        run: mise exec -- env NERVES_GATE_LOCAL_DEPS=1 mix 'do' compile + nerves_gate.new "$RUNNER_TEMP/workspace" --local "$GITHUB_WORKSPACE"
      - name: Exercise the ordinary app-developer commands (no device startup)
        run: |
          # shellcheck disable=SC2016
          mise exec -- sh -eu -c '
            cd "$RUNNER_TEMP/workspace"
            mix setup
            mix test
            mix app.new second_app
            mix setup
            mix test
            mix app.package my_app
            mix app.package second_app
            mix format --check-formatted
          '
