name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/host-tools
        with:
          firmware: 'true'
      - name: Cache host dependencies, builds and PLTs
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/test
            sdk/deps
            sdk/_build/test
            firmware/deps
            firmware/_build/test
          key: platform-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mix.lock', 'mix.exs', '*/mix.lock', '*/mix.exs') }}-${{ github.sha }}
          restore-keys: |
            platform-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mix.lock', 'mix.exs', '*/mix.lock', '*/mix.exs') }}-
      - name: Fetch locked host dependencies
        run: mise exec -- mix deps.get --check-locked
      - name: Quality gates and unit tests (no devices)
        run: mise exec -- mix ci

  firmware-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NERVES_SYSTEM: ''
      NERVES_DL_DIR: ${{ github.workspace }}/_build/nerves-downloads
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/host-tools
        with:
          qemu: 'true'
      - name: Cache verified firmware downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.NERVES_DL_DIR }}
            firmware/_build/setup
          key: firmware-downloads-${{ runner.os }}-${{ hashFiles('firmware/mix.lock', 'mise.toml', 'systems/nerves_system_ec100_qemu/**', 'mix.exs') }}
      - name: Prepare all projects without booting devices
        run: mise exec -- mix setup
      - name: Build assets and target firmware (never boot a device)
        run: mise exec -- mix firmware x86_64
      - name: Reject workstation-linked native ports
        run: mise exec -- elixir scripts/check_target.exs

  firmware-ec100:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    env:
      NERVES_SYSTEM: ''
      NERVES_DL_DIR: ${{ github.workspace }}/_build/nerves-downloads
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/host-tools
        with:
          firmware: 'true'
      - uses: actions/cache@v6
        with:
          path: ${{ env.NERVES_DL_DIR }}
          key: ec100-downloads-${{ runner.os }}-${{ hashFiles('firmware/mix.lock', 'systems/nerves_system_ec100/**', 'mise.toml') }}
      - name: Fetch locked host dependencies
        run: mise exec -- mix deps.get --check-locked
      - name: Fetch locked EC100 dependencies and initialize the target toolchain
        working-directory: firmware
        env:
          MIX_TARGET: ec100
          MIX_ENV: ${{ matrix.env }}
        run: |
          mise exec -- mix deps.get --check-locked
          mise exec -- mix nerves_bootstrap.init
      - name: Build EC100 firmware without flashing or booting
        run: mise exec -- mix firmware ec100 --env ${{ matrix.env }}

  applications:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/host-tools
      - name: Prepare host dependencies
        run: mise exec -- mix deps.get --check-locked
      - name: Exercise ordinary application commands (no devices)
        run: |
          mise exec -- mix app.new "$RUNNER_TEMP/demo" --local-sdk
          mise exec -- mix app.new "$RUNNER_TEMP/second_app" --local-sdk
          mise exec -- mix app.test "$RUNNER_TEMP/demo"
          mise exec -- mix app.test "$RUNNER_TEMP/second_app"
          mise exec -- mix app.package "$RUNNER_TEMP/demo"
          mise exec -- mix app.package "$RUNNER_TEMP/second_app"
          mise exec -- mix app.test plugins/tailnet_subrouter
          mise exec -- mix app.package plugins/tailnet_subrouter
          mise exec -- mix app.test plugins/modbus
          mise exec -- mix app.package plugins/modbus
