name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pure Elixir packages: no Nerves, QEMU or local path dependencies.
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        package: [sdk, new]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Compile, format and test
        run: |
          mise exec -- mix local.hex --force --if-missing
          mise exec -- mix deps.get
          mise exec -- mix compile --warnings-as-errors
          mise exec -- mix format --check-formatted
          mise exec -- mix test

  changes:
    runs-on: ubuntu-24.04
    outputs:
      system: ${{ steps.changes.outputs.system }}
      ec100: ${{ steps.changes.outputs.ec100 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Detect system changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: mise exec -- elixir .github/scripts/system_changes.exs

  system:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.system == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/system-artifact.yml
    with:
      target: x86_64

  system_ec100:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.ec100 == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/system-artifact.yml
    with:
      target: ec100

  qemu:
    needs: [changes, system]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      (needs.system.result == 'success' || needs.system.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NERVES_SYSTEM: ''
      NERVES_DL_DIR: ${{ github.workspace }}/_build/nerves-downloads
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Install simulator host tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.17.1 --repo fwup-home/fwup --pattern fwup_1.17.1_amd64.deb --dir "$RUNNER_TEMP"
          printf '%s  %s\n' b73ca78effe61e4c8cedcff567ca137b6bdaa1772b84f9e4d88913f192c09bf2 "$RUNNER_TEMP/fwup_1.17.1_amd64.deb" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libmnl-dev libnl-genl-3-dev qemu-system-x86 util-linux inotify-tools squashfs-tools e2fsprogs "$RUNNER_TEMP/fwup_1.17.1_amd64.deb"
      - name: Install Mix tooling outside the project
        run: |
          # shellcheck disable=SC2016
          mise exec -- sh -eu -c '
            cd "$RUNNER_TEMP"
            mix local.hex --force --if-missing
            mix local.rebar --force --if-missing
            mix archive.install hex nerves_bootstrap "~> 1.17" --force
          '
      - name: Cache verified downloads (never VM disks)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.NERVES_DL_DIR }}
            firmware/_build/setup
          key: simulator-downloads-${{ runner.os }}-${{ hashFiles('firmware/mix.lock', 'sim/mix.lock', 'mise.toml', 'systems/nerves_system_ec100_qemu/**', 'firmware/scripts/tailscaled.ex') }}
          restore-keys: simulator-downloads-${{ runner.os }}-
      - name: Fetch dependencies and the prebuilt system
        run: mise exec -- mix setup
      - name: Repository quality gates
        run: mise exec -- mix ci
      - name: Two-device simulator scenarios
        run: |
          mkdir -p sim/_build/qemu-tests
          set -o pipefail
          mise exec -- env -u NERVES_GATE_DEVICE_NODE mix test.firmware --ci 2>&1 | tee sim/_build/qemu-tests/suite.log
      - name: Retain diagnostics (never VM disks)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: sim/_build/qemu-tests/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  tailnet:
    name: Tailscale authentication
    needs: qemu
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: tailnet-ci
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NERVES_SYSTEM: ''
      NERVES_DL_DIR: ${{ github.workspace }}/_build/nerves-downloads
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Install simulator host tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.17.1 --repo fwup-home/fwup --pattern fwup_1.17.1_amd64.deb --dir "$RUNNER_TEMP"
          printf '%s  %s\n' b73ca78effe61e4c8cedcff567ca137b6bdaa1772b84f9e4d88913f192c09bf2 "$RUNNER_TEMP/fwup_1.17.1_amd64.deb" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libmnl-dev libnl-genl-3-dev qemu-system-x86 util-linux inotify-tools squashfs-tools e2fsprogs "$RUNNER_TEMP/fwup_1.17.1_amd64.deb"
      - name: Install Mix tooling outside the project
        run: |
          # shellcheck disable=SC2016
          mise exec -- sh -eu -c '
            cd "$RUNNER_TEMP"
            mix local.hex --force --if-missing
            mix local.rebar --force --if-missing
            mix archive.install hex nerves_bootstrap "~> 1.17" --force
          '
      - name: Cache verified downloads (never credentials or VM disks)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.NERVES_DL_DIR }}
            firmware/_build/setup
          key: simulator-downloads-${{ runner.os }}-${{ hashFiles('firmware/mix.lock', 'sim/mix.lock', 'mise.toml', 'systems/nerves_system_ec100_qemu/**', 'firmware/scripts/tailscaled.ex') }}
          restore-keys: simulator-downloads-${{ runner.os }}-
      - name: Fetch dependencies and the prebuilt system
        run: mise exec -- mix setup
      - name: Authenticate three QEMU guests and verify peer traffic
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TS_TAGS: tag:ci
        # Never tee stdout: GitHub masking commands contain generated credentials.
        # No raw daemon logs, identity disks or credentials are uploaded as artifacts.
        # --config is relative to sim/.
        run: mise exec -- env -u NERVES_GATE_DEVICE_NODE mix test.firmware --ci --only tailscale_auth --config priv/qemu/tailnet.exs
