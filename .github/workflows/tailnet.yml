name: Tailnet authentication

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailnet-authentication
  cancel-in-progress: false

jobs:
  tailnet:
    if: github.ref == 'refs/heads/main'
    environment: tailnet-ci
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MIX_TARGET: host
      MIX_ENV: test
      NERVES_SYSTEM: ''
      NERVES_DL_DIR: ${{ github.workspace }}/_build/nerves-downloads
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Install simulator host tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.17.1 --repo fwup-home/fwup --pattern fwup_1.17.1_amd64.deb --dir "$RUNNER_TEMP"
          printf '%s  %s\n' b73ca78effe61e4c8cedcff567ca137b6bdaa1772b84f9e4d88913f192c09bf2 "$RUNNER_TEMP/fwup_1.17.1_amd64.deb" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libmnl-dev libnl-genl-3-dev qemu-system-x86 util-linux inotify-tools squashfs-tools "$RUNNER_TEMP/fwup_1.17.1_amd64.deb"
      - name: Install Mix tooling outside the project
        run: |
          # shellcheck disable=SC2016
          mise exec -- sh -eu -c '
            cd "$RUNNER_TEMP"
            mix local.hex --force --if-missing
            mix local.rebar --force --if-missing
            mix archive.install hex nerves_bootstrap "~> 1.17" --force
          '
      - name: Cache verified downloads (never credentials or VM disks)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.NERVES_DL_DIR }}
            _build/setup
          key: simulator-downloads-${{ runner.os }}-${{ hashFiles('mix.lock', 'mise.toml', 'systems/nerves_system_ec100_qemu/**', 'dev/setup.exs') }}
          restore-keys: simulator-downloads-${{ runner.os }}-
      - name: Fetch dependencies and the prebuilt system
        id: setup
        run: mise exec -- mix setup
      - name: Check OIDC trust before building firmware or enrolling guests
        id: oidc
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: mise exec -- mix qemu.tailnet check
      - name: Authenticate three QEMU guests and verify peer traffic
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        # Never tee stdout: GitHub masking commands contain generated credentials.
        # No raw daemon logs, identity disks or credentials are uploaded as artifacts.
        run: mise exec -- env -u NERVES_GATE_DEVICE_NODE mix test --ci --only tailscale_auth --config dev/tailnet.exs
      - name: Remove only this run's nodes and revoke its recorded auth keys
        if: always() && steps.oidc.outcome == 'success'
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: mise exec -- mix qemu.tailnet cleanup
